name: Suggest a paper
description: Propose a model, benchmark, dataset, tool, review or interpretability study for the catalogue.
title: "Suggest: <name or title>"
labels: ["suggestion"]
body:
  - type: input
    id: link
    attributes:
      label: Paper link
      description: DOI, arXiv, bioRxiv or journal URL.
      placeholder: https://doi.org/...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options:
        - Model
        - Benchmark / evaluation
        - Interpretability study
        - Dataset or atlas
        - Tool / software
        - Survey or perspective
        - Not sure
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code or weights (optional)
      placeholder: https://github.com/...
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: For example a published version of a preprint, or why it belongs here.
