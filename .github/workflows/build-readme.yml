name: Check and build

# On pull requests: validate data/ and make sure the build works.
# On pushes to main: also regenerate README.md, docs/data.json, exports/ and
# reports/data-quality.md, and commit them if they changed.

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check data
        run: python scripts/check.py
      - name: Build
        run: python scripts/build.py
      - name: Commit generated files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/data.json exports reports/data-quality.md
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git commit -m "chore: regenerate README and data exports"
            git push
          fi
