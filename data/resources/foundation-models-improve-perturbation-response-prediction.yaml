key: Performed a comprehensive analysis of over 600 different models for embedding-based perturbation
  response prediction for both genetic and small molecule interventions. As we showed, while some FMs
  fail to improve over simpler methods for this task, others provide significant gains. Interactome based
  FMs, which are based on the underlying networks activated in the cell, performed particularly well.
