# Controlled vocabulary for the catalogue.
# scripts/check.py rejects any category, resource type or tag not listed here.
# To add or rename one, edit this file and run `python scripts/build.py`.

# Primary category for models: exactly one per model; decides its README section.
# Listed in README order.
categories:
  - id: scrna
    label: scRNA-seq / Transcriptomics Foundation Models
    desc: General-purpose transcriptome foundation models.
  - id: spatial
    label: Spatial & Spatial Multi-omics
    desc: Spatial transcriptomics, niches and tissue context.
  - id: epigenomics
    label: Epigenomics & Chromatin Accessibility (scATAC)
    desc: ATAC-seq and chromatin models.
  - id: multimodal
    label: Multimodal & Multi-omics Integration
    desc: Models that jointly encode several modalities.
  - id: proteomics
    label: Proteomics & Protein-level Models
    desc: Single-cell and spatial proteomics.
  - id: seq2exp
    label: Sequence-to-Expression & Regulatory Genomics
    desc: Models that predict expression from DNA sequence.
  - id: grn
    label: Gene Regulatory Networks & Graph-based Models
    desc: GRN inference and graph priors.
  - id: generative
    label: Generative Models (Diffusion / Flow / VAE)
    desc: Generative models of counts or expression.
  - id: morphology
    label: Cell Morphology & Imaging Models
    desc: Cell Painting, morphology and microscopy models.
  - id: llm
    label: LLM-based & Language-Cell Models
    desc: Models coupled to LLMs or text, and long-sequence (Hyena/Mamba) models.
  - id: agents
    label: Agentic & Autonomous Cell Models
    desc: Agents and autonomous analysis or experiment systems.
  - id: atlas
    label: Cross-species & Cell Atlas / Similarity Models
    desc: Atlas-scale, cross-species and cell-search models.
  - id: perturbation
    label: Perturbation Prediction & Virtual Cell / World Models
    desc: Perturbation response prediction and virtual-cell / world models.
  - id: other
    label: Other Single-cell Foundation Models
    desc: Fallback only.

# Resource types, listed in README order.
resource_types:
  - id: benchmark
    label: Benchmarks & Evaluation
  - id: dataset
    label: Datasets & Atlases
  - id: tool
    label: Tools & Software
  - id: survey
    label: Surveys
  - id: perspective
    label: Perspectives & Commentary
  - id: reference
    label: Other References

# Tags: any number per entry. Used for README badges and site filters.
tags:
  # modality
  - {id: scrna-seq, label: scRNA-seq, group: modality}
  - {id: scatac-seq, label: scATAC-seq, group: modality}
  - {id: spatial, label: Spatial, group: modality}
  - {id: proteomics, label: Proteomics, group: modality}
  - {id: multi-omics, label: Multi-omics, group: modality}
  - {id: imaging, label: Imaging, group: modality}
  - {id: histology, label: Histology, group: modality}
  - {id: text, label: Text, group: modality}
  - {id: dna-sequence, label: DNA sequence, group: modality}
  # task
  - {id: perturbation, label: Perturbation, group: task}
  - {id: gene-regulation, label: Gene regulation, group: task}
  - {id: cross-species, label: Cross-species, group: task}
  - {id: drug-response, label: Drug response, group: task}
  - {id: virtual-cell, label: Virtual cell, group: task}
  # approach
  - {id: llm, label: LLM, group: approach}
  - {id: agent, label: Agent, group: approach}
  - {id: generative, label: Generative, group: approach}
  - {id: graph, label: Graph, group: approach}
  - {id: foundation-model, label: Foundation model, group: approach}

# Allowed keys inside a model's `model_card` block (all optional).
model_card_fields:
  params: Parameter count as written by the authors, e.g. "51M" or "3B".
  pretraining_cells: Number of cells in the pretraining corpus, e.g. "33M".
  pretraining_data: Corpus name and version, e.g. "CELLxGENE Census 2023-05-15".
  species: List, e.g. [human, mouse].
  tokenization: e.g. rank, binning, value-projection, protein-embedding, text.
  objective: e.g. masked-gene, autoregressive, contrastive, diffusion.
  context_length: Max genes/tokens per cell.
  weights: one of [released, on-request, api-only, not-released].
  weights_url: Where the weights are hosted.
  license: Licence of code/weights, e.g. MIT, Apache-2.0, CC-BY-NC-4.0.
  package: pip/conda package name.

# ---- What a model takes in and gives back (model fields `inputs`, `outputs`, `architecture_family`).
# Values are set only when the paper, abstract or repository states them; add new values here (see CONTRIBUTING.md).
inputs:
  - {id: expression, label: Gene expression, desc: "Gene expression counts or profiles (scRNA-seq, snRNA-seq, bulk)."}
  - {id: chromatin-accessibility, label: Chromatin accessibility, desc: "scATAC-seq peaks or fragments."}
  - {id: protein-abundance, label: Protein abundance, desc: "CITE-seq antibody counts, cytometry or proteomics measurements."}
  - {id: spatial-coordinates, label: Spatial coordinates, desc: "Cell or spot positions, or spatial neighbourhoods."}
  - {id: histology-image, label: Histology image, desc: "H&E or other whole-slide images."}
  - {id: cell-image, label: Cell image, desc: "Microscopy, Cell Painting or protein-localisation images."}
  - {id: dna-sequence, label: DNA sequence, desc: "Genomic DNA sequence."}
  - {id: protein-sequence, label: Protein sequence, desc: "Amino-acid sequences or protein language model inputs."}
  - {id: text, label: Text, desc: "Natural language: metadata, descriptions or questions."}
  - {id: perturbation, label: Perturbation, desc: "Identity of a genetic or chemical perturbation."}
  - {id: prior-network, label: Prior network, desc: "A given graph: gene regulatory network, protein interactions, pathways or a knowledge graph."}
outputs:
  - {id: cell-embedding, label: Cell embedding, desc: "A vector representation per cell."}
  - {id: gene-embedding, label: Gene embedding, desc: "A vector representation per gene."}
  - {id: cell-type-label, label: Cell-type label, desc: "Cell-type annotation or classification."}
  - {id: disease-state, label: Disease state, desc: "Disease or condition status of cells or donors."}
  - {id: expression-prediction, label: Expression prediction, desc: "Imputation, denoising or cross-modality translation of measurements."}
  - {id: perturbation-response, label: Perturbation response, desc: "Predicted effect of a genetic or chemical perturbation."}
  - {id: generated-cells, label: Generated cells, desc: "Synthetic expression profiles."}
  - {id: gene-regulatory-network, label: Gene regulatory network, desc: "Inferred regulatory relationships."}
  - {id: gene-prioritization, label: Gene prioritization, desc: "Ranked genes, such as drivers, key regulators or therapeutic targets."}
  - {id: spatial-domain, label: Spatial domain, desc: "Niches, tissue domains or regions."}
  - {id: image, label: Image, desc: "Generated or predicted images."}
  - {id: text, label: Text, desc: "Natural-language answers or reports."}
architecture_families:
  - {id: transformer-encoder, label: Transformer encoder, desc: "BERT-style, bidirectional (masked modelling)."}
  - {id: transformer-decoder, label: Transformer decoder, desc: "GPT-style, autoregressive."}
  - {id: transformer-encoder-decoder, label: Transformer encoder-decoder, desc: "Separate encoder and decoder, including asymmetric designs."}
  - {id: state-space, label: State-space model, desc: "Mamba, Hyena and similar long-sequence models."}
  - {id: graph-neural-network, label: Graph neural network, desc: "Message passing over cell or gene graphs."}
  - {id: vae, label: VAE, desc: "Variational autoencoder."}
  - {id: diffusion, label: Diffusion model, desc: "Denoising diffusion, including latent and discrete diffusion."}
  - {id: flow-matching, label: Flow matching, desc: "Flow matching and optimal-transport flows."}
  - {id: contrastive-dual-encoder, label: Contrastive dual encoder, desc: "CLIP-style paired encoders trained contrastively."}
  - {id: llm, label: Large language model, desc: "A fine-tuned or prompted general-purpose LLM."}
  - {id: agent, label: Agent system, desc: "One or more LLM agents with tools."}
  - {id: other, label: Other, desc: "None of the above; the free-text `architecture` field says what."}

# ---- When a model has no code link (`code_status`): stops the "No code link" warning.
code_status:
  - {id: none-found, label: No code found, desc: "Searched the paper, GitHub and Hugging Face; nothing public."}
  - {id: release-pending, label: Release pending, desc: "The authors say code will be released."}
  - {id: not-public, label: Not public, desc: "Proprietary or company model."}

# ---- How an entry was checked (`review_basis`); `sources` lists the URLs.
review_basis:
  - {id: metadata, label: Metadata, desc: "Title, venue, year and links checked against Crossref, OpenAlex, arXiv or bioRxiv."}
  - {id: abstract, label: Abstract, desc: "Fields read from the paper's abstract."}
  - {id: paper, label: Full paper, desc: "Checked against the full text."}
  - {id: repo, label: Repository, desc: "Checked against the code repository or model card."}

# ---- Perturbation models only (optional).
perturbation_types:
  - {id: genetic, label: Genetic, desc: "CRISPR knockout, knockdown or activation; gene overexpression."}
  - {id: chemical, label: Chemical, desc: "Drugs and small molecules."}
  - {id: combination, label: Combination, desc: "Combinations of two or more perturbations."}
generalization:
  - {id: unseen-perturbation, label: Unseen perturbation, desc: "Predicts perturbations not seen in training."}
  - {id: unseen-cell-context, label: Unseen cell context, desc: "Predicts in cell types or lines not seen in training."}
  - {id: cross-dataset, label: Cross-dataset, desc: "Transfers to datasets from other studies."}
  - {id: cross-species, label: Cross-species, desc: "Transfers across species."}
  - {id: zero-shot, label: Zero-shot, desc: "Works without task-specific training."}
