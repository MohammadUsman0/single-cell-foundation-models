- name: LMRL Workshop @ ICLR
  type: Workshop
  desc: The single best fit — explicitly built around virtual cells, with tracks on causality, generative
    modeling, and interpretable representations in biology Annual ICLR workshop; short + long paper tracks
- name: Mechanistic Interpretability Workshop @ ICML
  type: Workshop
  desc: The flagship mech-interp venue (drew 600+ at NeurIPS 2025). Accepts short/long papers; fast-tracks
    accepted main-conf papers ICML 2026, Seoul, Jul 10; 2026 deadline was May 8 (watch for the next edition)
  link: https://mechinterpworkshop.com/
- name: MLCB (Machine Learning in Computational Biology)
  type: Conference
  desc: Independent conference (ex-NeurIPS workshop), strong ML-for-biology audience; values mechanistic
    insight Nov 16–17, NY Genome Center; co-located near NeurIPS
  link: https://www.mlcb.org/
- name: ISMB / ISCB (incl. iscbAI track)
  type: Conference
  desc: World's largest comp-bio conference; new dedicated AI track (iscbAI). Proceedings transferable
    to Bioinformatics Advances ISMB 2026, Washington DC; abstract deadlines ~Apr–May
- name: RECOMB
  type: Conference
  desc: Top algorithmic comp-bio conference (peer of ISMB), rigorous review RECOMB 2026, Thessaloniki;
    paper deadline ~mid-Nov (prior year)
- name: NeurIPS / ICLR / ICML main tracks
  type: Conference
  desc: For methods-heavy scFM or interpretability contributions aimed at the core ML community
- name: Re-Align Workshop @ ICML
  type: Conference
  desc: Representational alignment + neural control; overlaps mech-interp; accepts concurrent submissions
  link: https://representational-alignment.github.io/2026/
- name: Nature Methods
  type: Journal
  desc: Premier venue for new computational methods; has published scGPT, multimodal FM perspectives High
    bar; methods + benchmarking
- name: Nature Communications
  type: Journal
  desc: Broad; publishes interpretable scFMs (e.g., CellVQ) Good for full method + biology stories
  link: https://www.nature.com/ncomms/
- name: Cell / Cell Systems
  type: Journal
  desc: Systems biology + virtual cell vision pieces; perturbation modeling Cell Systems is more method-friendly
- name: Nature Reviews Genetics
  type: Journal
  desc: Review/perspective on interpretation, extrapolation, perturbation of single cells For reviews/perspectives,
    not primary methods
- name: Genome Biology
  type: Journal
  desc: Strong single-cell methods home Open access
- name: Bioinformatics / Bioinformatics Advances (OUP)
  type: Journal
  desc: Core comp-bio methods; ISMB proceedings transfer here; OA option Faster turnaround
- name: Experimental & Molecular Medicine
  type: Journal
  desc: Published the major scFM review "bringing AI into cell biology" Good for reviews
  link: https://www.nature.com/emm/
- name: eLife
  type: Journal
  desc: Reviewed-preprint model; biology + methods Public review process
  link: https://elifesciences.org/
- name: LLMs in drug discovery, genomics, single-cell analysis
  type: Special issue
  desc: IEEE J. Biomedical & Health Informatics
- name: Advances in Single-Cell & Spatial Transcriptomics (Virtual Issue)
  type: Special issue
  desc: Bioinformatics (OUP)
- name: Integrative Multi-Omics Approaches (Virtual Issue)
  type: Special issue
  desc: Bioinformatics Advances (OUP)
- name: CZI Virtual Cells benchmarking outputs
  type: Special issue
  desc: Community (arXiv → journal)
