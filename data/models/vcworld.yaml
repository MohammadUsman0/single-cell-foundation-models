key: 'present VCWorld, a cell-level white-box simulator that integrates structured biological knowledge
  with the iterative reasoning capabilities of large language models to instantiate a biological world
  model. powered by a Large Language Model (LLM). It consists of three key stages: (1) generating rich,
  symbolic representations for all biological entities; (2) retrieving a support set of causal evidence
  guided by open-world biological knowledge; and (3) synthesizing all information through a Chain-of-Thought
  process to produce an interpretable prediction.'
