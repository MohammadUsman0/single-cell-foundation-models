key: a model that learns to predict cell-type-specific and tissue-specific RNA-seq coverage from DNA sequence.
  Using statistics derived from Borzoi’s predicted coverage, we isolate and accurately score DNA variant
  effects across multiple layers of regulation, including transcription, splicing and polyadenylation.
