key: 'Issue: standard language models such as transformers benefits from sequentially structured data
  with well defined absolute or relative positional relationships, while single cell RNA data have orderless
  gene features. Molecular-interaction graphs, such as gene regulatory networks (GRN) or protein-protein
  interaction (PPI) networks, offer graph structure-based models that effectively encode both non-local
  gene token dependencies, as well as potential causal relationships. So they introduce GREmLN (Gene Regulatory
  Embedding-based Large Neural model), a foundation model that leverages graph signal processing to embed
  gene token graph structure directly within its attention mechanism, producing biologically informed
  single cell specific gene embeddings'
links:
