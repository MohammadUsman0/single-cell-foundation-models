<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Single-Cell Foundation Models</title>
  <meta name="description" content="A searchable catalogue of single-cell foundation models and AI virtual-cell models, with the benchmarks, datasets and tools around them.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%232f5fb3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <a href="#/models">Single-Cell Foundation Models</a>
        <small id="counts">Loading…</small>
      </div>
      <nav class="nav" aria-label="Sections">
        <a href="#/models" data-nav="models">Models</a>
        <a href="#/resources" data-nav="resources">Resources</a>
      </nav>
      <form class="search" role="search" onsubmit="return false">
        <label class="visually-hidden" for="q">Search</label>
        <input id="q" type="search" placeholder="Search name, title, alias or description" autocomplete="off">
      </form>
      <div class="header-links">
        <a id="repo-link" href="https://github.com/MohammadUsman0/single-cell-foundation-models">GitHub</a>
        <a id="contrib-link" href="https://github.com/MohammadUsman0/single-cell-foundation-models/blob/main/CONTRIBUTING.md">Contribute</a>
      </div>
    </div>
  </header>

  <main id="app"><div class="loading">Loading catalogue…</div></main>

  <footer class="site-footer">
    <div class="inner">
      <span id="generated"></span>
      <span>Data: <a href="data.json">data.json</a> · CC0-1.0</span>
      <span>Bibliographic details are checked against Crossref, OpenAlex, arXiv and bioRxiv.</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
